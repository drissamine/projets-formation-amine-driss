apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: mon-app-servicemonitor
  namespace: monitoring
spec:
  namespaceSelector:
    matchNames:
      - tp-devops-calculatrice
  selector:
    matchLabels:
      app: calculatrice
  endpoints:
    - port: web
      path: /metric
      interval: 15s
