apiVersion: apps/v1
kind: Deployment
metadata:
  name: mon-app-deployment
  namespace: tp-devops-calculatrice
spec:
  replicas: 3
  selector:
    matchLabels:
      app: calculatrice
  template:
    metadata:
      labels:
        app: calculatrice
    spec:
      containers:
        - name: mon-app-container
          image: mon-app-js:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"
          envFrom:
            - configMapRef:
                name: mon-app-config
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: REDIS_PASSWORD
          livenessProbe:
            httpGet:
              path: /health/live
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: mon-app-service
  namespace: tp-devops-calculatrice
spec:
  type: ClusterIP
  selector:
    app: calculatrice
  ports:
    - name: web
      protocol: TCP
      port: 80
      targetPort: 3000
