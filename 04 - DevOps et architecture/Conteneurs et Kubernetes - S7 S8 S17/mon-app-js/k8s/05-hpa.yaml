apiVersion: autoscaling/v1
kind: HorizontalPodAutoscaler
metadata:
  name: mon-app-hpa
  namespace: tp-devops-calculatrice
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mon-app-deployment
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 60
