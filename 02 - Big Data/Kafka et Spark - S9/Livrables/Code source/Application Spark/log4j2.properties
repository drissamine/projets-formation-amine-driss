# Config log4j2 du projet : console propre (niveau ERROR), bruit de shutdown coupé.
# Chargée via -Dlog4j2.configurationFile au lancement de Spark (voir spark_consumer.py).
status = error
name = streaming-pipeline

appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yy/MM/dd HH:mm:ss} %p %c{1}: %m%n

rootLogger.level = error
rootLogger.appenderRef.stdout.ref = console

# Coupe les ERROR cosmétiques de suppression de dossiers temp à la fermeture (Windows)
logger.shutdown.name = org.apache.spark.util.ShutdownHookManager
logger.shutdown.level = off
logger.javautils.name = org.apache.spark.network.util.JavaUtils
logger.javautils.level = off
logger.hadoopshutdown.name = org.apache.hadoop.util.ShutdownHookManager
logger.hadoopshutdown.level = off
