<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 560" width="2080" height="1120" font-family="'Segoe UI', Arial, sans-serif">
  <rect x="0" y="0" width="1040" height="560" fill="#ffffff"/>
  <text x="520" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#1B2A4A">Schéma en flocon (Snowflake Schema) — RetailPlus</text>

  <!-- liens -->
  <g stroke="#6C8EBF" stroke-width="1.5">
    <!-- fact -> dims -->
    <line x1="520" y1="150" x2="110" y2="182"/>
    <line x1="520" y1="150" x2="274" y2="182"/>
    <line x1="520" y1="150" x2="438" y2="182"/>
    <line x1="520" y1="150" x2="602" y2="182"/>
    <line x1="520" y1="150" x2="766" y2="182"/>
    <line x1="520" y1="150" x2="930" y2="182"/>
    <!-- chaines normalisees -->
    <line x1="110" y1="240" x2="110" y2="282"/>
    <line x1="110" y1="340" x2="110" y2="382"/>
    <line x1="274" y1="240" x2="274" y2="282"/>
    <line x1="274" y1="340" x2="274" y2="382"/>
    <line x1="438" y1="240" x2="438" y2="282"/>
    <line x1="438" y1="340" x2="438" y2="382"/>
    <line x1="438" y1="440" x2="438" y2="482"/>
  </g>

  <!-- FACT -->
  <rect x="445" y="68" width="150" height="82" rx="4" fill="#FFE6CC" stroke="#D79B00" stroke-width="1.8"/>
  <rect x="445" y="68" width="150" height="22" rx="4" fill="#D79B00"/>
  <text x="520" y="83" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">FactVente</text>
  <text x="520" y="106" text-anchor="middle" font-size="9" fill="#7d5e10">6 clés étrangères (FK)</text>
  <text x="520" y="120" text-anchor="middle" font-size="9" font-weight="700" fill="#9a6f00">CA · Bénéfice</text>
  <text x="520" y="134" text-anchor="middle" font-size="9" font-weight="700" fill="#9a6f00">Quantité · Remise</text>

  <!-- niveau 1 : dimensions -->
  <g font-size="9.5">
    <!-- normalisees -->
    <g>
      <rect x="40" y="182" width="140" height="58" rx="4" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="1.4"/>
      <rect x="40" y="182" width="140" height="19" rx="4" fill="#6C8EBF"/>
      <text x="110" y="195" text-anchor="middle" font-weight="700" fill="#fff">DimTemps</text>
      <text x="110" y="216" text-anchor="middle" fill="#22364f">DateKey · Jour</text>
      <text x="110" y="230" text-anchor="middle" fill="#22364f">Mois</text>
    </g>
    <g>
      <rect x="204" y="182" width="140" height="58" rx="4" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="1.4"/>
      <rect x="204" y="182" width="140" height="19" rx="4" fill="#6C8EBF"/>
      <text x="274" y="195" text-anchor="middle" font-weight="700" fill="#fff">DimProduit</text>
      <text x="274" y="216" text-anchor="middle" fill="#22364f">ProduitKey · Nom</text>
      <text x="274" y="230" text-anchor="middle" fill="#22364f">→ CategorieKey</text>
    </g>
    <g>
      <rect x="368" y="182" width="140" height="58" rx="4" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="1.4"/>
      <rect x="368" y="182" width="140" height="19" rx="4" fill="#6C8EBF"/>
      <text x="438" y="195" text-anchor="middle" font-weight="700" fill="#fff">DimMagasin</text>
      <text x="438" y="216" text-anchor="middle" fill="#22364f">MagasinKey</text>
      <text x="438" y="230" text-anchor="middle" fill="#22364f">→ VilleKey</text>
    </g>
    <!-- simples -->
    <g>
      <rect x="532" y="182" width="140" height="58" rx="4" fill="#EAF1FA" stroke="#9bb6d6" stroke-width="1.2"/>
      <rect x="532" y="182" width="140" height="19" rx="4" fill="#9bb6d6"/>
      <text x="602" y="195" text-anchor="middle" font-weight="700" fill="#2b3f5a">DimClient</text>
      <text x="602" y="216" text-anchor="middle" fill="#22364f">ClientKey · Nom</text>
      <text x="602" y="230" text-anchor="middle" fill="#7a8aa0">(non normalisée)</text>
    </g>
    <g>
      <rect x="696" y="182" width="140" height="58" rx="4" fill="#EAF1FA" stroke="#9bb6d6" stroke-width="1.2"/>
      <rect x="696" y="182" width="140" height="19" rx="4" fill="#9bb6d6"/>
      <text x="766" y="195" text-anchor="middle" font-weight="700" fill="#2b3f5a">DimCanal</text>
      <text x="766" y="216" text-anchor="middle" fill="#22364f">CanalKey · Type</text>
      <text x="766" y="230" text-anchor="middle" fill="#7a8aa0">(non normalisée)</text>
    </g>
    <g>
      <rect x="860" y="182" width="140" height="58" rx="4" fill="#EAF1FA" stroke="#9bb6d6" stroke-width="1.2"/>
      <rect x="860" y="182" width="140" height="19" rx="4" fill="#9bb6d6"/>
      <text x="930" y="195" text-anchor="middle" font-weight="700" fill="#2b3f5a">DimPromotion</text>
      <text x="930" y="216" text-anchor="middle" fill="#22364f">PromoKey · Type</text>
      <text x="930" y="230" text-anchor="middle" fill="#7a8aa0">(non normalisée)</text>
    </g>
  </g>

  <!-- niveau 2 et 3 : sous-dimensions -->
  <g font-size="9.5">
    <!-- Temps -->
    <rect x="40" y="282" width="140" height="58" rx="4" fill="#D5E8D4" stroke="#82B366" stroke-width="1.3"/>
    <rect x="40" y="282" width="140" height="19" rx="4" fill="#82B366"/>
    <text x="110" y="295" text-anchor="middle" font-weight="700" fill="#fff">DimTrimestre</text>
    <text x="110" y="320" text-anchor="middle" fill="#2e5020">TrimestreKey</text>
    <rect x="40" y="382" width="140" height="50" rx="4" fill="#D5E8D4" stroke="#82B366" stroke-width="1.3"/>
    <rect x="40" y="382" width="140" height="19" rx="4" fill="#82B366"/>
    <text x="110" y="395" text-anchor="middle" font-weight="700" fill="#fff">DimAnnee</text>
    <text x="110" y="419" text-anchor="middle" fill="#2e5020">AnneeKey</text>
    <!-- Produit -->
    <rect x="204" y="282" width="140" height="58" rx="4" fill="#D5E8D4" stroke="#82B366" stroke-width="1.3"/>
    <rect x="204" y="282" width="140" height="19" rx="4" fill="#82B366"/>
    <text x="274" y="295" text-anchor="middle" font-weight="700" fill="#fff">DimCategorie</text>
    <text x="274" y="320" text-anchor="middle" fill="#2e5020">CategorieKey · Nom</text>
    <rect x="204" y="382" width="140" height="50" rx="4" fill="#D5E8D4" stroke="#82B366" stroke-width="1.3"/>
    <rect x="204" y="382" width="140" height="19" rx="4" fill="#82B366"/>
    <text x="274" y="395" text-anchor="middle" font-weight="700" fill="#fff">DimMarque</text>
    <text x="274" y="419" text-anchor="middle" fill="#2e5020">MarqueKey · Nom</text>
    <!-- Magasin -->
    <rect x="368" y="282" width="140" height="50" rx="4" fill="#D5E8D4" stroke="#82B366" stroke-width="1.3"/>
    <rect x="368" y="282" width="140" height="19" rx="4" fill="#82B366"/>
    <text x="438" y="295" text-anchor="middle" font-weight="700" fill="#fff">DimVille</text>
    <text x="438" y="319" text-anchor="middle" fill="#2e5020">VilleKey → RegionKey</text>
    <rect x="368" y="382" width="140" height="50" rx="4" fill="#D5E8D4" stroke="#82B366" stroke-width="1.3"/>
    <rect x="368" y="382" width="140" height="19" rx="4" fill="#82B366"/>
    <text x="438" y="395" text-anchor="middle" font-weight="700" fill="#fff">DimRegion</text>
    <text x="438" y="419" text-anchor="middle" fill="#2e5020">RegionKey → PaysKey</text>
    <rect x="368" y="482" width="140" height="50" rx="4" fill="#D5E8D4" stroke="#82B366" stroke-width="1.3"/>
    <rect x="368" y="482" width="140" height="19" rx="4" fill="#82B366"/>
    <text x="438" y="495" text-anchor="middle" font-weight="700" fill="#fff">DimPays</text>
    <text x="438" y="519" text-anchor="middle" fill="#2e5020">PaysKey · Nom</text>
  </g>

  <text x="700" y="300" font-size="11" font-style="italic" fill="#777">Les dimensions hiérarchiques sont</text>
  <text x="700" y="318" font-size="11" font-style="italic" fill="#777">normalisées en sous-dimensions</text>
  <text x="700" y="336" font-size="11" font-style="italic" fill="#777">(moins de redondance, plus de jointures).</text>
</svg>
