<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 560" width="2080" height="1120" font-family="'Segoe UI', Arial, sans-serif">
  <rect x="0" y="0" width="1040" height="560" fill="#ffffff"/>
  <text x="520" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#1B2A4A">Cube OLAP des ventes — RetailPlus</text>

  <!-- ===== CUBE ISOMÉTRIQUE ===== -->
  <g>
    <polygon points="250,110 348.7,167 250,224 151.3,167" fill="#7FC6D6"/>
    <polygon points="151.3,167 250,224 250,338 151.3,281" fill="#1B2A4A"/>
    <polygon points="250,224 348.7,167 348.7,281 250,338" fill="#2F7FB8"/>
    <!-- grilles top -->
    <g stroke="#EAF1FA" stroke-width="1" opacity=".6">
      <line x1="282.9" y1="129" x2="184.2" y2="186"/>
      <line x1="315.8" y1="148" x2="217.1" y2="205"/>
      <line x1="217.1" y1="129" x2="315.8" y2="186"/>
      <line x1="184.2" y1="148" x2="282.9" y2="205"/>
    </g>
    <!-- grilles gauche -->
    <g stroke="#5E7AA6" stroke-width="1" opacity=".7">
      <line x1="184.2" y1="186" x2="184.2" y2="300"/>
      <line x1="217.1" y1="205" x2="217.1" y2="319"/>
      <line x1="151.3" y1="205" x2="250" y2="262"/>
      <line x1="151.3" y1="243" x2="250" y2="300"/>
    </g>
    <!-- grilles droite -->
    <g stroke="#9BC6E6" stroke-width="1" opacity=".55">
      <line x1="282.9" y1="205" x2="282.9" y2="319"/>
      <line x1="315.8" y1="186" x2="315.8" y2="300"/>
      <line x1="250" y1="262" x2="348.7" y2="205"/>
      <line x1="250" y1="300" x2="348.7" y2="243"/>
    </g>
    <!-- aretes -->
    <polygon points="250,110 348.7,167 250,224 151.3,167" fill="none" stroke="#fff" stroke-width="1.4"/>
    <path d="M151.3,167 L151.3,281 L250,338 L348.7,281 L348.7,167 M250,224 L250,338" fill="none" stroke="#fff" stroke-width="1.4"/>
  </g>
  <!-- axes -->
  <text x="370" y="150" font-size="11.5" font-weight="700" fill="#2F7FB8">Produit ↗</text>
  <text x="95" y="150" font-size="11.5" font-weight="700" fill="#0E7C86">↖ Géographie</text>
  <text x="250" y="360" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1B2A4A">Temps ↓</text>

  <!-- ===== PANNEAU INFO ===== -->
  <!-- Dimensions -->
  <text x="430" y="92" font-size="13" font-weight="700" fill="#0E7C86">Dimensions &amp; hiérarchies</text>
  <g font-size="10.8" fill="#33425A">
    <text x="430" y="116">• <tspan font-weight="700">Géographie</tspan> : Pays › Région › Ville</text>
    <text x="430" y="138">• <tspan font-weight="700">Temps</tspan> : Année › Trimestre › Mois</text>
    <text x="430" y="160">• <tspan font-weight="700">Produit</tspan> : Catégorie › Sous-catégorie › Produit</text>
    <text x="430" y="182">• <tspan font-weight="700">Canal</tspan> : Magasin / E-commerce / App</text>
    <text x="430" y="204">• <tspan font-weight="700">Promotion</tspan> : Solde / Cashback / Bundle</text>
  </g>
  <!-- Mesures -->
  <text x="770" y="92" font-size="13" font-weight="700" fill="#C77D1E">Mesures</text>
  <g font-size="10.8" fill="#33425A">
    <text x="770" y="116">• CA = <tspan font-family="monospace">SUM(Montant)</tspan></text>
    <text x="770" y="138">• Bénéfice = <tspan font-family="monospace">SUM(Benefice)</tspan></text>
    <text x="770" y="160">• Quantité = <tspan font-family="monospace">SUM(Quantite)</tspan></text>
    <text x="770" y="182">• Nb ventes = <tspan font-family="monospace">COUNT(*)</tspan></text>
    <text x="770" y="204">• Panier moyen = <tspan font-family="monospace">AVG(Montant)</tspan></text>
  </g>

  <line x1="40" y1="390" x2="1000" y2="390" stroke="#DBE3EE"/>
  <text x="40" y="415" font-size="13" font-weight="700" fill="#B85450">Les 5 opérations OLAP applicables sur ce cube</text>

  <!-- 5 opérations -->
  <g font-size="10">
    <rect x="33" y="430" width="185" height="95" rx="6" fill="#EAF2FA" stroke="#2F7FB8" stroke-width="1.3"/>
    <text x="46" y="452" font-size="12" font-weight="700" fill="#1f5f8f">Roll-up</text>
    <text x="46" y="472" fill="#33425A">Agréger (monter</text>
    <text x="46" y="487" fill="#33425A">la hiérarchie) :</text>
    <text x="46" y="505" font-weight="700" fill="#1f5f8f">Mois → Année</text>

    <rect x="230" y="430" width="185" height="95" rx="6" fill="#EAF2FA" stroke="#2F7FB8" stroke-width="1.3"/>
    <text x="243" y="452" font-size="12" font-weight="700" fill="#1f5f8f">Drill-down</text>
    <text x="243" y="472" fill="#33425A">Détailler (descendre</text>
    <text x="243" y="487" fill="#33425A">la hiérarchie) :</text>
    <text x="243" y="505" font-weight="700" fill="#1f5f8f">Région → Ville</text>

    <rect x="427" y="430" width="185" height="95" rx="6" fill="#EAF2FA" stroke="#2F7FB8" stroke-width="1.3"/>
    <text x="440" y="452" font-size="12" font-weight="700" fill="#1f5f8f">Slice</text>
    <text x="440" y="472" fill="#33425A">Fixer 1 dimension :</text>
    <text x="440" y="490" font-weight="700" fill="#1f5f8f">Année = 2026</text>
    <text x="440" y="508" fill="#33425A">(tranche 2D)</text>

    <rect x="624" y="430" width="185" height="95" rx="6" fill="#EAF2FA" stroke="#2F7FB8" stroke-width="1.3"/>
    <text x="637" y="452" font-size="12" font-weight="700" fill="#1f5f8f">Dice</text>
    <text x="637" y="472" fill="#33425A">Filtrer plusieurs</text>
    <text x="637" y="487" fill="#33425A">dimensions :</text>
    <text x="637" y="505" font-weight="700" fill="#1f5f8f">sous-cube</text>

    <rect x="821" y="430" width="185" height="95" rx="6" fill="#EAF2FA" stroke="#2F7FB8" stroke-width="1.3"/>
    <text x="834" y="452" font-size="12" font-weight="700" fill="#1f5f8f">Pivot</text>
    <text x="834" y="472" fill="#33425A">Faire tourner</text>
    <text x="834" y="487" fill="#33425A">les axes :</text>
    <text x="834" y="505" font-weight="700" fill="#1f5f8f">lignes ⇄ colonnes</text>
  </g>
</svg>
